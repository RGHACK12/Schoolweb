<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="stylesheet" href="styles/style.css"/>
  <title>login</title>
</head>
<body>
  
  <div class="scene">
    
    <input type="checkbox" id="flip-toggle">
    
    <div class="container">
      
      <div class="card-face card-front">
        
        <div class="heading">
      <h2>
        Login
      </h2>
          <p>
            Hello Witian!
          </p>
        </div>
      <form>
        <input type="email" id="email" placeholder="Email" required="">
        <input type="password" id="password" placeholder="Password" required="">
        <button class="btn" type="submit">Login</button>
      </form>
      
      <div class="link">
        <p>
          Dont have an account?
        </p>
        <label for="flip-toggle" class="flip-link">Create</label>
      </div>
    </div>
    
    
    <div class="card-face card-back">
      <div class="heading2">
      <h2 >
        Create
      </h2>
      <p>
        Join to become Witian!
      </p>
      </div>
      <form>
        <input type="text" id="usename" placeholder="Username" required="">
        <input type="email" id="email" placeholder="Email" required="">
        <input type="password" id="password" placeholder="Password" required="">
        <input type="password" id="password" placeholder="Confirm Password" required="">
        <button class="btn" type="submit">Register</button>
      </form>
      
      <div class="link">
        <p>
          Already have an account?
        </p>
        <label for="flip-toggle" class="flip-link">Login</label>
      </div>
      
    </div>
    
    
  </div>
  
</body>
</html>
